---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - module.luweglarz.dev
  resources:
  - blackboxmodules
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - module.luweglarz.dev
  resources:
  - blackboxmodules/finalizers
  verbs:
  - update
- apiGroups:
  - module.luweglarz.dev
  resources:
  - blackboxmodules/status
  verbs:
  - get
  - patch
  - update
